<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你的潛意識人格原型是什麼？</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, #120523, #09030f 60%);
      color: #f3e8ff;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
    }

    body::before {
      width: 360px;
      height: 360px;
      background: rgba(139, 76, 255, 0.26);
      top: -80px;
      left: -60px;
    }

    body::after {
      width: 320px;
      height: 320px;
      background: rgba(255, 108, 168, 0.18);
      bottom: -100px;
      right: -40px;
    }

    .page {
      width: min(100%, 720px);
      max-width: 780px;
      background: rgba(12, 8, 24, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 34px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 10% 10%, rgba(135, 78, 239, 0.16), transparent 25%),
                  radial-gradient(circle at 90% 15%, rgba(255, 103, 174, 0.12), transparent 22%),
                  radial-gradient(circle at 50% 90%, rgba(83, 58, 180, 0.12), transparent 24%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      padding: 28px;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      letter-spacing: 0.04em;
      line-height: 1.05;
      margin-bottom: 18px;
      color: #fff;
    }

    .hero p {
      max-width: 660px;
      margin: 0 auto;
      color: #c8b8e5;
      font-size: 17px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .btn-primary {
      display: inline-flex;
      margin: 26px auto 0;
      padding: 16px 28px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #8b66ff, #ff76b0);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 18px 42px rgba(139, 102, 255, 0.28);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 46px rgba(139, 102, 255, 0.36);
    }

    .stage {
      display: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .stage.active {
      display: block;
      opacity: 1;
    }

    .progress-wrap {
      border-radius: 18px;
      padding: 18px 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: #c8b8e5;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff77b8, #8b66ff);
      transition: width 0.45s ease;
    }

    .question-box {
      margin-top: 18px;
      animation: fadeInSlide 0.45s ease;
    }

    .question-title {
      font-size: 1.3rem;
      line-height: 1.7;
      color: #f8f2ff;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .choice-card {
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 26px;
      padding: 18px 16px;
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      overflow: hidden;
    }

    .choice-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
    }

    .choice-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(255,255,255,0.16), transparent 32%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .choice-card:hover::after {
      opacity: 1;
    }

    .choice-label {
      font-size: 13px;
      color: #d8c8ff;
      margin-bottom: 12px;
    }

    .choice-text {
      color: #f7f1ff;
      font-size: 16px;
      line-height: 1.8;
    }

    .result-panel {
      border-radius: 30px;
      background: rgba(20, 16, 40, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 24px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.30);
      position: relative;
    }

    .result-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(121, 93, 235, 0.16), transparent 28%);
      pointer-events: none;
    }

    .result-title {
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: #fff;
      margin-bottom: 10px;
    }

    .result-subtitle {
      color: #c9b7e7;
      line-height: 1.9;
      margin-bottom: 22px;
    }

    .pill {
      display: inline-flex;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #e6dcff;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .trait-list {
      display: grid;
      gap: 14px;
      margin-bottom: 24px;
    }

    .trait-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 18px 16px;
      line-height: 1.8;
      color: #e8dffa;
      font-size: 15px;
    }

    .trait-card strong {
      display: block;
      font-size: 15px;
      margin-bottom: 10px;
      color: #fff;
    }

    .chart-container {
      margin-bottom: 22px;
      display: grid;
      place-items: center;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .actions button {
      flex: 1 1 48%;
      min-width: 150px;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-share {
      background: linear-gradient(135deg, #8b66ff, #ff95cc);
      color: #fff;
    }

    .btn-restart {
      background: rgba(255,255,255,0.08);
      color: #e8dffa;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .actions button:hover {
      transform: translateY(-2px);
    }

    canvas {
      width: min(100%, 380px);
      height: auto;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .content { gap: 18px; padding: 22px; }
      .card-grid { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
    }

    @media (max-width: 520px) {
      .page { padding: 18px; }
      .hero h1 { font-size: 2.2rem; }
      .hero p { font-size: 15px; }
      .choice-card { padding: 16px 14px; }
      .result-panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <section id="intro" class="stage active">
        <div class="hero">
          <h1>你的潛意識人格原型是什麼？</h1>
          <p>人們以為自己了解自己，\n但真正驅動你的，\n往往是潛意識中的核心原型。</p>
        </div>
        <button class="btn-primary" id="startButton">開始測驗</button>
      </section>

      <section id="quiz" class="stage">
        <div class="progress-wrap">
          <div class="progress-label"><span id="progressText">第 1 / 7 題</span><span id="progressPercent">0%</span></div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="question-box" id="questionBox">
          <div class="question-title" id="questionTitle"></div>
          <div class="card-grid" id="choices"></div>
        </div>
      </section>

      <section id="result" class="stage">
        <div class="result-panel">
          <div class="result-title" id="resultTitle"></div>
          <div class="result-subtitle" id="resultSubtitle"></div>
          <div class="pill" id="resultPill"></div>

          <div class="chart-container">
            <canvas id="radarChart" width="380" height="380"></canvas>
          </div>

          <div class="trait-list">
            <div class="trait-card"><strong>特質</strong><div id="traitText"></div></div>
            <div class="trait-card"><strong>盲點</strong><div id="blindSpot"></div></div>
          </div>

          <div class="actions">
            <button class="btn-share" id="shareButton">分享結果</button>
            <button class="btn-restart" id="restartButton">重新測驗</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const quizData = [
      {
        question: '你收到一封神秘邀請函。\n邀請你進入一座從未被發現的森林。\n森林中央據說藏著能改變人生的寶物。\n你會？',
        choices: [
          { label: 'A. 立刻出發', score: { A: 3 } },
          { label: 'B. 先研究地圖', score: { L: 2, A: 1 } },
          { label: 'C. 找朋友一起', score: { E: 2 } },
          { label: 'D. 懷疑真實性', score: { L: 2, C: 1 } }
        ]
      },
      {
        question: '進入森林後出現三條路。\n你選擇？',
        choices: [
          { label: 'A. 看起來最危險的路', score: { A: 3 } },
          { label: 'B. 最多人走過的路', score: { E: 2 } },
          { label: 'C. 沒有人走過的小路', score: { C: 3 } },
          { label: 'D. 分析後再決定', score: { L: 3 } }
        ]
      },
      {
        question: '路上遇到受傷旅人。\n他請求幫助。\n你會？',
        choices: [
          { label: 'A. 先救人', score: { E: 3 } },
          { label: 'B. 確認是否有危險', score: { L: 2 } },
          { label: 'C. 教他自救方法', score: { L: 2, E: 1 } },
          { label: 'D. 繼續自己的任務', score: { A: 3 } }
        ]
      },
      {
        question: '你發現一個寶箱。\n裡面可能有寶物。\n也可能有陷阱。\n你會？',
        choices: [
          { label: 'A. 直接打開', score: { A: 3 } },
          { label: 'B. 仔細研究機關', score: { L: 3 } },
          { label: 'C. 想像可能用途', score: { C: 3 } },
          { label: 'D. 詢問同行者意見', score: { E: 2 } }
        ]
      },
      {
        question: '旅途中同伴發生衝突。\n你通常會？',
        choices: [
          { label: 'A. 出面領導', score: { L: 3 } },
          { label: 'B. 安撫雙方', score: { E: 3 } },
          { label: 'C. 提出創新解法', score: { C: 3 } },
          { label: 'D. 直接做事解決', score: { A: 3 } }
        ]
      },
      {
        question: '巨龍問你：\n你最想獲得什麼？',
        choices: [
          { label: 'A. 力量', score: { A: 3 } },
          { label: 'B. 影響力', score: { L: 3 } },
          { label: 'C. 理解他人的能力', score: { E: 3 } },
          { label: 'D. 無限創意', score: { C: 3 } }
        ]
      },
      {
        question: '寶藏出現。\n但只能選一個。',
        choices: [
          { label: 'A. 權杖', score: { L: 4 } },
          { label: 'B. 水晶', score: { C: 4 } },
          { label: 'C. 羽毛', score: { E: 4 } },
          { label: 'D. 火焰', score: { A: 4 } }
        ]
      }
    ];

    const archetypes = {
      L: {
        title: '天生領航者',
        subtitle: '你擅長掌控全局，引導他人一起前進。',
        traits: '決策力強\n善於規劃\n有影響力',
        blindSpot: '容易過度掌控',
        color: '#bb86fc'
      },
      E: {
        title: '心靈療癒者',
        subtitle: '你能感受他人情緒，並化為支援與陪伴。',
        traits: '同理心高\n善於溝通\n重視關係',
        blindSpot: '容易過度付出',
        color: '#7c90ff'
      },
      C: {
        title: '創意探索家',
        subtitle: '你喜歡突破框架，用想像力開創新方向。',
        traits: '創意豐富\n好奇心強\n喜歡突破框架',
        blindSpot: '容易想太多',
        color: '#4ad9d8'
      },
      A: {
        title: '無畏行動者',
        subtitle: '你勇於冒險，總是先行一步踏出改變。',
        traits: '執行力強\n勇於冒險\n抗壓性高',
        blindSpot: '容易衝動',
        color: '#ff7c8e'
      }
    };

    const startButton = document.getElementById('startButton');
    const introSection = document.getElementById('intro');
    const quizSection = document.getElementById('quiz');
    const resultSection = document.getElementById('result');
    const questionTitle = document.getElementById('questionTitle');
    const choicesContainer = document.getElementById('choices');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const progressFill = document.getElementById('progressFill');
    const resultTitle = document.getElementById('resultTitle');
    const resultSubtitle = document.getElementById('resultSubtitle');
    const resultPill = document.getElementById('resultPill');
    const traitText = document.getElementById('traitText');
    const blindSpot = document.getElementById('blindSpot');
    const shareButton = document.getElementById('shareButton');
    const restartButton = document.getElementById('restartButton');
    const radarCanvas = document.getElementById('radarChart');

    let currentQuestion = 0;
    let score = { L: 0, E: 0, C: 0, A: 0 };
    let selectedKey = null;

    startButton.addEventListener('click', () => {
      toggleStage(introSection, false);
      toggleStage(quizSection, true);
      renderQuestion();
    });

    restartButton.addEventListener('click', () => {
      resetQuiz();
      toggleStage(resultSection, false);
      toggleStage(quizSection, true);
      renderQuestion();
    });

    shareButton.addEventListener('click', () => {
      if (!selectedKey) return;
      const item = archetypes[selectedKey];
      const shareText = `我的潛意識人格原型是「${item.title}」。\n${item.subtitle}`;
      if (navigator.share) {
        navigator.share({ title: '潛意識人格原型測驗', text: shareText, url: window.location.href }).catch(() => {});
      } else {
        copyToClipboard(window.location.href);
        alert('連結已複製，可貼給朋友分享你的原型結果。');
      }
    });

    function toggleStage(section, show) {
      section.classList.toggle('active', show);
      section.style.display = show ? 'block' : 'none';
    }

    function resetQuiz() {
      currentQuestion = 0;
      score = { L: 0, E: 0, C: 0, A: 0 };
      selectedKey = null;
    }

    function renderQuestion() {
      const step = quizData[currentQuestion];
      questionTitle.textContent = step.question;
      choicesContainer.innerHTML = '';
      step.choices.forEach(choice => {
        const button = document.createElement('button');
        button.className = 'choice-card';
        button.innerHTML = `<div class="choice-label">${choice.label.slice(0,2)}</div><div class="choice-text">${choice.label.slice(3)}</div>`;
        button.addEventListener('click', () => selectChoice(choice.score));
        choicesContainer.appendChild(button);
      });
      updateProgress();
    }

    function updateProgress() {
      const percent = Math.round(((currentQuestion + 1) / quizData.length) * 100);
      progressText.textContent = `第 ${currentQuestion + 1} / ${quizData.length} 題`;
      progressPercent.textContent = `${percent}%`;
      progressFill.style.width = `${percent}%`;
    }

    function selectChoice(choiceScore) {
      Object.keys(choiceScore).forEach(key => {
        score[key] += choiceScore[key];
      });
      currentQuestion += 1;
      if (currentQuestion >= quizData.length) {
        renderResult();
      } else {
        animateQuestionSwitch();
      }
    }

    function animateQuestionSwitch() {
      const box = document.getElementById('questionBox');
      box.style.opacity = '0';
      box.style.transform = 'translateY(18px)';
      setTimeout(() => {
        renderQuestion();
        box.style.opacity = '1';
        box.style.transform = 'translateY(0)';
      }, 280);
    }

    function renderResult() {
      selectedKey = getTopDimension();
      const item = archetypes[selectedKey];
      resultTitle.textContent = item.title;
      resultSubtitle.textContent = item.subtitle;
      resultPill.textContent = `最強維度：${selectedKey}`;
      traitText.textContent = item.traits;
      blindSpot.textContent = item.blindSpot;
      drawRadarChart();
      toggleStage(quizSection, false);
      toggleStage(resultSection, true);
    }

    function getTopDimension() {
      const ordered = Object.entries(score).sort((a, b) => b[1] - a[1]);
      return ordered[0][0];
    }

    function drawRadarChart() {
      const ctx = radarCanvas.getContext('2d');
      const width = radarCanvas.width;
      const height = radarCanvas.height;
      const cx = width / 2;
      const cy = height / 2;
      const maxRadius = 140;
      const values = [score.L, score.E, score.C, score.A];
      const labels = ['領導力', '同理心', '創造力', '行動力'];
      const maxValue = 12;
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1;
      for (let ring = 1; ring <= 4; ring++) {
        const radius = (maxRadius / 4) * ring;
        ctx.beginPath();
        for (let i = 0; i < labels.length; i++) {
          const angle = (Math.PI * 2 / labels.length) * i - Math.PI / 2;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      for (let i = 0; i < labels.length; i++) {
        const angle = (Math.PI * 2 / labels.length) * i - Math.PI / 2;
        const x = cx + Math.cos(angle) * maxRadius;
        const y = cy + Math.sin(angle) * maxRadius;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      const points = values.map((value, index) => {
        const ratio = Math.min(value / maxValue, 1);
        const angle = (Math.PI * 2 / labels.length) * index - Math.PI / 2;
        return {
          x: cx + Math.cos(angle) * ratio * maxRadius,
          y: cy + Math.sin(angle) * ratio * maxRadius,
          label: labels[index]
        };
      });
      ctx.beginPath();
      ctx.fillStyle = 'rgba(139, 102, 255, 0.28)';
      ctx.strokeStyle = 'rgba(255, 158, 222, 0.96)';
      ctx.lineWidth = 2;
      points.forEach((p, index) => {
        if (index === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f0e7ff';
      points.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = '#d6c5ff';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      points.forEach((p, index) => {
        const offsetX = p.x > cx ? 25 : p.x < cx ? -25 : 0;
        const offsetY = p.y > cy ? 20 : p.y < cy ? -20 : 0;
        ctx.fillText(p.label, p.x + offsetX, p.y + offsetY);
      });
      ctx.restore();
    }

    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }
  </script>
</body>
</html>
